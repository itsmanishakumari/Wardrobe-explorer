server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/wardrobe
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.jackson.deserialization.accept-float-as-int=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
server.error.include-stacktrace=never
wardrobe.images-directory=./data/images
wardrobe.ollama-base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
wardrobe.vision-model=${OLLAMA_VISION_MODEL:gemma3:4b}
wardrobe.text-model=${OLLAMA_TEXT_MODEL:gemma3:4b}